<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
  <title>Soustraction avec emprunt — Jeu de maths</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/soustraction.css">
</head>
<body>
  <header class="barre-haut">
    <a id="btn-retour" class="lien-retour" href="../index.html">← Accueil</a>
    <div id="badge-joueur" class="badge-joueur"></div>
  </header>

  <main class="page">
    <!-- Menu de l'activité -->
    <section id="ecran-menu"></section>

    <!-- Écran de jeu -->
    <section id="ecran-jeu" hidden>
      <div class="entete-jeu">
        <h2 id="titre-phase"></h2>
        <div id="progression" class="progression"></div>
      </div>

      <div class="zone-jeu">
        <div id="probleme" class="carte probleme"></div>
        <div id="blocs" class="carte blocs" hidden aria-hidden="true"></div>
      </div>

      <div id="bulle" class="carte bulle" aria-live="polite"></div>
      <div id="choix" class="choix"></div>

      <div class="controles">
        <div id="clavier" class="clavier" aria-label="Clavier de chiffres"></div>
        <div class="actions">
          <button id="btn-verifier" class="bouton vert gros" type="button">✔ Vérifier</button>
          <button id="btn-suivant" class="bouton gros" type="button">Suivant ▸</button>
          <button id="btn-aide" class="bouton secondaire" type="button">💡 Besoin d'aide?</button>
        </div>
      </div>
    </section>

    <!-- Écran de fin (médaille, fin du tutoriel) -->
    <section id="ecran-fin" hidden></section>
  </main>

  <script src="../js/commun.js"></script>
  <script src="../js/soustraction-modele.js"></script>
  <script src="../js/soustraction-emprunt.js"></script>
</body>
</html>
